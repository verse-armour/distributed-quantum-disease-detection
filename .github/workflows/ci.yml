name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Run quick model test
      run: |
        cd code && python -c "
import torch
from mobilnet import MobileNetV2
from mps3 import QNN
from backbone_3 import QCNet

# Test model initialization and forward pass
print('Testing MobileNetV2...')
mobilenet = MobileNetV2(num_classes=8)
x = torch.randn(1, 3, 224, 224)
out = mobilenet(x)
assert out.shape == (1, 8), f'MobileNetV2 output shape mismatch: {out.shape}'
print(f'MobileNetV2 output shape: {out.shape} ✓')

print('Testing QNN...')
qnn = QNN()
x = torch.randn(1, 8)
out = qnn(x)
assert out.shape == (1, 32), f'QNN output shape mismatch: {out.shape}'
print(f'QNN output shape: {out.shape} ✓')

print('Testing QCNet (full model)...')
model = QCNet()
x = torch.randn(1, 3, 224, 224)
out = model(x)
assert out.shape == (1, 3), f'QCNet output shape mismatch: {out.shape}'
print(f'QCNet output shape: {out.shape} ✓')

print('All model tests passed!')
"

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 code/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 code/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
